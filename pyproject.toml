[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-data-platform"
version = "1.0.0"
description = "Cloud-independent, self-service data infrastructure platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.2",
    "uvicorn[standard]==0.27.1",
    "sqlalchemy==2.0.27",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "celery==5.3.6",
    "redis==5.0.1",
    "pydantic[email]==2.6.1",
    "pydantic-settings==2.1.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.2",
    "cryptography==42.0.2",
    "httpx==0.26.0",
    "python-multipart==0.0.6",
    "elasticsearch==8.13.0",
    "clickhouse-connect==0.7.0",
    "dagster==1.5.14",
    "dagster-webserver==1.5.14",
    "dbt-core==1.10.0",
    "dbt-postgres==1.10.0",
    "prometheus-client==0.20.0",
    "croniter==2.0.1",
    "kombu==5.3.5",
    "aiofiles==23.2.1",
    "tenacity==8.2.3",
    "structlog==24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "pytest-asyncio==0.23.4",
    "pytest-cov==4.1.0",
    "hypothesis==6.98.0",
    "factory-boy==3.3.0",
    "httpx==0.26.0",
    "ruff==0.2.1",
    "mypy==1.8.0",
    "pre-commit==3.6.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "property: Property-based tests",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["backend/app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
