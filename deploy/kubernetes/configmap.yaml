apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: cloud-data-platform
  labels:
    app.kubernetes.io/name: cloud-data-platform
    app.kubernetes.io/component: config
data:
  # Application Settings
  APP_NAME: "cloud-data-platform"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_VERSION: "1.0.0"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  API_PREFIX: "/api/v1"

  # PostgreSQL Database
  POSTGRES_HOST: "postgresql-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "cloud_data_platform"
  POSTGRES_USER: "platform_user"

  # ClickHouse Database
  CLICKHOUSE_HOST: "clickhouse-service"
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_HTTP_PORT: "8123"
  CLICKHOUSE_NATIVE_PORT: "9000"
  CLICKHOUSE_DB: "lineage"
  CLICKHOUSE_USER: "default"

  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # RabbitMQ
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"
  RABBITMQ_MANAGEMENT_PORT: "15672"
  RABBITMQ_USER: "platform_user"
  RABBITMQ_VHOST: "/"

  # Elasticsearch
  ELASTICSEARCH_HOST: "elasticsearch-service"
  ELASTICSEARCH_PORT: "9200"
  ELASTICSEARCH_SCHEME: "http"
  ELASTICSEARCH_USER: "elastic"
  ELASTICSEARCH_LOG_RETENTION_DAYS: "90"

  # Dagster
  DAGSTER_HOME: "/opt/dagster/dagster_home"
  DAGSTER_WEBSERVER_HOST: "dagster-webserver-service"
  DAGSTER_WEBSERVER_PORT: "3000"
  DAGSTER_PG_HOST: "postgresql-service"
  DAGSTER_PG_PORT: "5432"
  DAGSTER_PG_DB: "dagster"
  DAGSTER_PG_USER: "dagster_user"

  # dbt
  DBT_PROFILES_DIR: "/opt/dbt/profiles"
  DBT_PROJECT_DIR: "/opt/dbt/project"

  # Prometheus & Grafana
  PROMETHEUS_PORT: "9090"
  GRAFANA_PORT: "3001"

  # Rate Limiting
  RATE_LIMIT_REQUESTS_PER_MINUTE: "100"
  RATE_LIMIT_WINDOW_SECONDS: "60"

  # Notification Settings
  NOTIFICATION_RETENTION_DAYS: "30"
  NOTIFICATION_DEDUP_WINDOW_MINUTES: "15"

  # Audit Log Settings
  AUDIT_LOG_RETENTION_DAYS: "730"
  AUDIT_LOG_STORAGE_WARNING_THRESHOLD: "0.9"
  AUDIT_LOG_MAX_EXPORT_RECORDS: "100000"

  # Lineage Settings
  LINEAGE_RETENTION_DAYS: "365"
  LINEAGE_MAX_TRAVERSAL_DEPTH: "10"

  # Pipeline Settings
  PIPELINE_MAX_NODES: "50"
  PIPELINE_MAX_EDGES: "100"
  PIPELINE_MAX_RETRIES: "3"
  PIPELINE_STATUS_POLL_INTERVAL_SECONDS: "5"

  # Payload Limits
  MAX_PAYLOAD_SIZE_MB: "10"

  # Air-Gapped Mode
  AIR_GAPPED_MODE: "false"

  # Account Security
  ACCOUNT_LOCKOUT_THRESHOLD: "5"
  ACCOUNT_LOCKOUT_DURATION_MINUTES: "15"
  PASSWORD_RESET_TOKEN_EXPIRY_HOURS: "24"

  # JWT Settings
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
  JWT_ALGORITHM: "HS256"
  BCRYPT_COST_FACTOR: "12"

  # Celery Settings
  CELERY_TASK_ALWAYS_EAGER: "false"
  CELERY_WORKER_CONCURRENCY: "4"
