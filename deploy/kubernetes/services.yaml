apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: cloud-data-platform
  labels:
    app.kubernetes.io/name: cloud-data-platform
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: cloud-data-platform
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: cloud-data-platform
  labels:
    app.kubernetes.io/name: cloud-data-platform
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: cloud-data-platform
    app.kubernetes.io/component: frontend
---
