global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "cloud-data-platform"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: "/api/v1/monitoring/metrics"
    scrape_interval: 10s

  - job_name: "dagster"
    static_configs:
      - targets: ["dagster-webserver:3000"]
    metrics_path: "/metrics"
    scrape_interval: 30s
