# =============================================================================
# Cloud-Independent Data Platform — NGINX Reverse Proxy Configuration
# =============================================================================
# Provides TLS termination, static asset serving, API proxying,
# WebSocket support, rate limiting, and security headers.
# =============================================================================

# Worker configuration
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # -------------------------------------------------------------------
    # Basic Settings
    # -------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Max request body size (matches platform's 10MB payload limit)
    client_max_body_size 10m;
    client_body_buffer_size 128k;

    # -------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------------------
    # Gzip Compression
    # -------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # -------------------------------------------------------------------
    # Rate Limiting Zones
    # -------------------------------------------------------------------
    # General API rate limit: 100 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # Auth endpoint rate limit: stricter to prevent brute force
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

    # WebSocket connection limit
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # Rate limit response
    limit_req_status 429;

    # -------------------------------------------------------------------
    # Upstream Definitions
    # -------------------------------------------------------------------
    upstream backend_api {
        least_conn;
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_app {
        server frontend:80;
        keepalive 16;
    }

    upstream dagster_webserver {
        server dagster-webserver:3000;
        keepalive 8;
    }

    # -------------------------------------------------------------------
    # HTTP → HTTPS Redirect
    # -------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Health check endpoint available over HTTP for load balancers
        location /nginx-health {
            access_log off;
            return 200 '{"service_name": "nginx", "status": "healthy"}';
            add_header Content-Type application/json;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------
    # HTTPS Server
    # -------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ${NGINX_SERVER_NAME};

        # ---------------------------------------------------------------
        # TLS Configuration (configurable cert paths)
        # ---------------------------------------------------------------
        ssl_certificate /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # OCSP stapling (disabled for air-gapped, enable if connected)
        # ssl_stapling on;
        # ssl_stapling_verify on;

        # ---------------------------------------------------------------
        # Security Headers
        # ---------------------------------------------------------------
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://$host; frame-ancestors 'none';" always;

        # ---------------------------------------------------------------
        # Backend API (/api/v1/ → backend:8000)
        # ---------------------------------------------------------------
        location /api/v1/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 4 32k;
        }

        # ---------------------------------------------------------------
        # Auth Endpoints (stricter rate limiting)
        # ---------------------------------------------------------------
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ---------------------------------------------------------------
        # Health Check Endpoint
        # ---------------------------------------------------------------
        location /health {
            access_log off;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }

        # ---------------------------------------------------------------
        # WebSocket Support for Real-Time Updates
        # ---------------------------------------------------------------
        location /ws {
            limit_conn ws_conn 100;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;

            # Disable buffering for WebSocket
            proxy_buffering off;
        }

        # ---------------------------------------------------------------
        # Dagster UI (internal tool, restricted access)
        # ---------------------------------------------------------------
        location /dagster/ {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://dagster_webserver/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ---------------------------------------------------------------
        # Static Assets (frontend build output, aggressive caching)
        # ---------------------------------------------------------------
        location /assets/ {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            # Cache static assets for 1 year (fingerprinted filenames)
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ---------------------------------------------------------------
        # Frontend (SPA, catch-all)
        # ---------------------------------------------------------------
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # SPA: try upstream first, fallback handled by frontend nginx
            proxy_intercept_errors off;
        }

        # ---------------------------------------------------------------
        # Deny access to hidden files
        # ---------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ---------------------------------------------------------------
        # Custom Error Pages
        # ---------------------------------------------------------------
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
